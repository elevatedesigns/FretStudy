[workspace]
resolver = "2"
members = ["crates/theory", "crates/audio", "crates/app", "crates/content", "crates/store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
theory = { path = "crates/theory" }
audio = { path = "crates/audio" }

[profile.dev.package."*"]
# Keep audio DSP fast even in debug builds.
opt-level = 2

[profile.release]
lto = "thin"
